<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>E-posta doğrulandı | Olympos</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8f3e8;color:#2a2520}
  .kart{max-width:420px;margin:24px;padding:36px 28px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(30,111,168,.15);text-align:center}
  .isaret{width:72px;height:72px;border-radius:50%;background:#3f6b3a;color:#fff;font-size:42px;line-height:72px;margin:0 auto 18px}
  h1{margin:0 0 10px;color:#1e6fa8;font-size:24px}
  p{line-height:1.6;margin:8px 0}
</style>
</head>
<body>
<div class="kart">
  <div class="isaret">&#10003;</div>
  <h1>E-postan doğrulandı</h1>
  <p>Hesabın başarıyla onaylandı.</p>
  <p>Şimdi <b>Olympos</b> uygulamasına dönüp e-posta ve şifrenle giriş yapabilirsin.</p>
</div>
<script>
  // Adres çubuğundaki oturum bilgisi (#access_token...) görünür kalmasın.
  if (location.hash) history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
